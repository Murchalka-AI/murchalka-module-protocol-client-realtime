name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: dotnet nuget update source murchalka --username "${GITHUB_ACTOR}" --password "${PACKAGE_TOKEN}" --store-password-in-clear-text --configfile NuGet.Config
      - name: Restore
        run: dotnet restore Murchalka.ClientRealtime.slnx --configfile NuGet.Config
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format Murchalka.ClientRealtime.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Murchalka.ClientRealtime.slnx --configuration Release --no-restore
      - name: Test and conformance
        run: dotnet run --project tests/Murchalka.ClientRealtime.Tests/Murchalka.ClientRealtime.Tests.csproj --configuration Release --no-build --no-restore -- -reporter quiet


